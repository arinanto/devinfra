# yaml-language-server: $schema=https://agentgateway.dev/schema/config
config:
  database:
    url: sqlite:///config/primary.db
  logging:
    database:
      url: sqlite:///config/telemetry.db
  session:
    key: $AGENTGW_SESSION_KEY
  modelCatalog:
  - inline:
      providers:
        deepseek:
          models:
            deepseek-flash:
              rates:
                input: '0.3'
                output: '1.2'
                cacheRead: '0.006'
        zai:
          models:
            glm-5.3:
              rates:
                input: '1.4'
                output: '4.4'
                cacheRead: '0.26'
        openrouter:
          models:
            moonshotai/kimi-k3.1-pro:
              rates:
                input: '2'
                output: '10'
                cacheRead: '0.2'
# Gateway settings
gateways:
  user:
    port: 38080
    protocol: HTTP
  agent:
    port: 4000
    protocol: HTTP

# LLM configs
llm:
  gateways: agent
  providers:
  - provider: deepseek
    params:
      apiKey: $DEEPSEEK_API_KEY
    name: deepseek
  - provider:
      custom:
        formats:
        - type: completions
    params:
      apiKey: $ZAI_API_KEY
      baseUrl: https://api.z.ai/api/paas/v4
    name: zai
  - provider: openrouter
    params:
      apiKey: $OPENROUTER_API_KEY
    name: openrouter
  models:
  - name: deepseek/deepseek-flash
    provider:
      reference: deepseek
    params:
      model: deepseek-flash
  - name: zai/glm-5.3
    provider:
      reference: zai
    params:
      model: glm-5.3
  - params:
      model: moonshotai/kimi-k3.1-pro
    name: moonshotai/kimi-k3.1-pro
    provider:
      reference: openrouter
  policies:
    apiKey:
      mode: strict
      keys: []

    guardrails:
      request:
      - regex:
          action: audit
          rules:
          - builtin: caSin
          - builtin: ssn
          - builtin: creditCard
          - builtin: phoneNumber
          - builtin: email
routes:
  - gateways: agent
    matches:
      - path:
          pathPrefix: /proxy/deepseek
        method: POST
    backends:
      - host: api.deepseek.com:443
        policies:
          backendTLS:
            insecure: false
    name: deepseek-tools-api-proxy
    policies:
      authorization:
        rules:
          - require: |-
              "authorization" in request.headers &&
              request.headers.authorization == "Bearer $DOWNSTREAM_DEEPSEEK_SEARCH_TOKEN"
          - require: |-
              request.path == "/proxy/deepseek/v1/tools/search" ||
              request.path == "/proxy/deepseek/v1/tools/fetch"
      requestHeaderModifier:
        set:
          authorization: Bearer $DEEPSEEK_API_KEY
      urlRewrite:
        path:
          prefix: /
  - gateways: agent
    matches:
      - path:
          exact: /mcp/github
        method: POST
    backends:
      - host: api.githubcopilot.com:443
        policies:
          backendTLS:
            insecure: false
    name: github-mcp-proxy
    policies:
      authorization:
        rules:
          - require: |-
              "authorization" in request.headers &&
              request.headers.authorization == "Bearer $DOWNSTREAM_GITHUB_MCP_TOKEN"
      requestHeaderModifier:
        set:
          authorization: Bearer $GITHUB_MCP_PAT
      urlRewrite:
        path:
          full: /mcp/

  # The browser half of a dev environment, on the same port as everything else.
  # Playwright MCP publishes no host port of its own: an unauthenticated browser
  # on loopback is one any local process can drive, and the gateway already
  # carries a bearer token for every other remote service.
  #
  # No `method:` here on purpose. GitHub MCP only ever posts, but streamable HTTP
  # uses POST to send, GET to open the server->client stream and DELETE to end
  # the session, so a POST-only match would break the latter two.
  #
  # `urlRewrite: full: /mcp/` collapses the client's /mcp/playwright (or
  # /mcp/playwright/<anything>) onto the path the browser server actually
  # serves. Point clients at http://<this host>:4000/mcp/playwright.
  - gateways: agent
    matches:
      - path:
          pathPrefix: /mcp/playwright
    backends:
      - host: systemd-playwrightmcp:8931
    name: playwright-mcp-proxy
    policies:
      authorization:
        rules:
          - require: |-
              "authorization" in request.headers &&
              request.headers.authorization == "Bearer $DOWNSTREAM_PLAYWRIGHT_MCP_TOKEN"
      urlRewrite:
        path:
          full: /mcp/

  # Forgejo MCP, same shape as the browser route above: a pathPrefix match and a
  # full rewrite onto /mcp, which is the only path forgejo-mcp serves. No
  # `method:` here for the same reason as above -- streamable HTTP uses POST,
  # GET and DELETE -- and no trailing slash on the rewrite because that path is
  # registered exactly.
  #
  # The bearer is a surrogate, like every other route's: a client presents
  # DOWNSTREAM_FORGEJO_MCP_TOKEN and the gateway replaces it with the real
  # FORGEJO_ACCESS_TOKEN before the request reaches forgejo-mcp, which forwards
  # that token to Forgejo. No client config ever holds a Forgejo credential, and
  # `set` rather than `add` means a client cannot pass one through untouched
  # either.
  #
  # What that costs is identity. Every environment writing through this route
  # writes as the one Forgejo user FORGEJO_ACCESS_TOKEN belongs to, and Forgejo's
  # audit log cannot tell the environments apart. One identity per environment
  # would need one route, one DOWNSTREAM_* token and one Forgejo token per
  # environment in this file; a single shared static config cannot express it
  # otherwise, so the trade is made once here rather than per deployment.
  #
  # FORGEJO_ACCESS_TOKEN is a gateway credential like GITHUB_MCP_PAT: it lives in
  # skel/envars/agentgateway.env, next to that and the provider keys, and nowhere
  # else. The Forgejo MCP server behind this route holds no credential of its own
  # and does not need one, so the header set here is the only one that ever
  # reaches it.
  - gateways: agent
    matches:
      - path:
          pathPrefix: /mcp/forgejo
    backends:
      - host: systemd-forgejomcp:8080
    name: forgejo-mcp-proxy
    policies:
      authorization:
        rules:
          - require: |-
              "authorization" in request.headers &&
              request.headers.authorization == "Bearer $DOWNSTREAM_FORGEJO_MCP_TOKEN"
      requestHeaderModifier:
        set:
          authorization: Bearer $FORGEJO_ACCESS_TOKEN
      urlRewrite:
        path:
          full: /mcp

# UI settings
ui:
  gateways: user
  policies:
    basicAuth:
      htpasswd:
        file: /config/agwadmins.htpasswd
      mode: strict
      realm: agentgateway
